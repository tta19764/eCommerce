<section class="mx-auto max-w-xl px-4 py-16">
  <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
    <h1 class="text-2xl font-bold">Create an account</h1>
    <p class="mt-2 text-slate-500">Register to place orders and track their status.</p>

    <form class="mt-6 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="mb-1 block text-sm font-medium" for="first-name">First name</label>
          <input
            id="first-name"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
            formControlName="firstName"
          />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium" for="last-name">Last name</label>
          <input
            id="last-name"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
            formControlName="lastName"
          />
        </div>
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium" for="register-email">Email address</label>
        <input
          id="register-email"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
          type="email"
          formControlName="email"
          autocomplete="email"
        />
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium" for="register-password">Password</label>
        <input
          id="register-password"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
          type="password"
          formControlName="password"
          autocomplete="new-password"
        />
        <p class="mt-1 text-sm text-slate-500">Use at least 8 characters.</p>
      </div>

      @if (error()) {
        <div class="rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700">
          {{ error() }}
        </div>
      }

      <button
        class="w-full rounded-lg bg-brand-600 px-4 py-2.5 font-semibold text-white hover:bg-brand-700 disabled:bg-slate-300"
        type="submit"
        [disabled]="busy()"
      >
        {{ busy() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      Already registered?
      <a class="font-semibold text-brand-600" routerLink="/login">Sign in</a>
    </p>
  </div>
</section>
