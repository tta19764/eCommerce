<section class="mx-auto max-w-xl px-4 py-16">
  <div class="glass-panel rounded-2xl p-6 sm:p-8 border border-slate-800 shadow-2xl space-y-6">
    
    <div class="text-center space-y-2">
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-bold text-xl shadow-sm">
        ✨
      </div>
      <h1 class="text-2xl font-extrabold text-white">Create Marketplace Account</h1>
      <p class="text-xs text-slate-400">Select your account role and register for customer or seller access.</p>
    </div>

    <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <fieldset>
        <legend class="block text-xs font-bold text-slate-300 mb-2">Select Account Role</legend>
        <div class="grid gap-3 sm:grid-cols-2">
          <button
            type="button"
            (click)="accountType.set('customer')"
            [class]="accountType() === 'customer'
              ? 'bg-indigo-600/20 border-indigo-500 text-white shadow-md'
              : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:text-slate-200'"
            class="rounded-xl border p-4 text-left transition-all"
          >
            <strong class="block text-xs font-bold text-indigo-300">Customer Account</strong>
            <span class="mt-1 block text-[11px] text-slate-400">Shop items, checkout orders, & message sellers.</span>
          </button>

          <button
            type="button"
            (click)="accountType.set('seller')"
            [class]="accountType() === 'seller'
              ? 'bg-emerald-500/20 border-emerald-500 text-white shadow-md'
              : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:text-slate-200'"
            class="rounded-xl border p-4 text-left transition-all"
          >
            <strong class="block text-xs font-bold text-emerald-400">Seller Account</strong>
            <span class="mt-1 block text-[11px] text-slate-400">Create product listings & manage inventory.</span>
          </button>
        </div>
      </fieldset>

      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1" for="first-name">First Name</label>
          <input id="first-name" formControlName="firstName" class="w-full glass-input rounded-xl px-3.5 py-2.5 text-xs" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1" for="last-name">Last Name</label>
          <input id="last-name" formControlName="lastName" class="w-full glass-input rounded-xl px-3.5 py-2.5 text-xs" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1" for="register-email">Email Address</label>
        <input id="register-email" type="email" formControlName="email" autocomplete="email" placeholder="your.email@domain.com" class="w-full glass-input rounded-xl px-3.5 py-2.5 text-xs" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1" for="register-password">Password</label>
        <input id="register-password" type="password" formControlName="password" autocomplete="new-password" placeholder="Minimum 8 characters" class="w-full glass-input rounded-xl px-3.5 py-2.5 text-xs" />
      </div>

      @if (error()) {
        <div class="rounded-xl border border-rose-500/30 bg-rose-500/10 p-3 text-xs font-semibold text-rose-300">
          {{ error() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="busy()"
        class="w-full gradient-button rounded-xl py-3 text-xs font-bold text-white shadow-md disabled:opacity-40"
      >
        {{ busy() ? 'Creating Account...' : (accountType() === 'seller' ? 'Register Seller Account' : 'Register Customer Account') }}
      </button>
    </form>

    <div class="pt-4 border-t border-slate-800 text-center text-xs text-slate-400">
      Already registered?
      <a routerLink="/login" class="font-bold text-indigo-400 hover:text-indigo-300 ml-1">Sign in here</a>
    </div>
  </div>
</section>
