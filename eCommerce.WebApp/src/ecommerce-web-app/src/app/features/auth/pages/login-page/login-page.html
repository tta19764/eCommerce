<section class="mx-auto max-w-md px-4 py-20">
  <div class="glass-panel rounded-2xl p-6 sm:p-8 border border-slate-800 shadow-2xl space-y-6">
    
    <div class="text-center space-y-2">
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-bold text-xl shadow-sm">
        🔐
      </div>
      <h1 class="text-2xl font-extrabold text-white">Welcome Back</h1>
      <p class="text-xs text-slate-400">Sign in to your account to access your orders and messages.</p>
    </div>

    <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1" for="login-email">Email Address</label>
        <input
          id="login-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="your.email@domain.com"
          class="w-full glass-input rounded-xl px-3.5 py-2.5 text-xs"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <p class="mt-1 text-[11px] text-rose-400 font-semibold">Please enter a valid email address.</p>
        }
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1" for="login-password">Password</label>
        <input
          id="login-password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
          class="w-full glass-input rounded-xl px-3.5 py-2.5 text-xs"
        />
      </div>

      @if (error()) {
        <div class="rounded-xl border border-rose-500/30 bg-rose-500/10 p-3 text-xs font-semibold text-rose-300">
          {{ error() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="busy()"
        class="w-full gradient-button rounded-xl py-3 text-xs font-bold text-white shadow-md disabled:opacity-40"
      >
        {{ busy() ? 'Authenticating...' : 'Sign In to Account' }}
      </button>
    </form>

    <div class="pt-4 border-t border-slate-800 text-center text-xs text-slate-400">
      Don't have an account yet?
      <a routerLink="/register" class="font-bold text-indigo-400 hover:text-indigo-300 ml-1">
        Register Customer / Seller
      </a>
    </div>
  </div>
</section>
