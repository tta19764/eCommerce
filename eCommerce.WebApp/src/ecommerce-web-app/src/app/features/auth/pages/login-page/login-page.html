<section class="mx-auto max-w-md px-4 py-16">
  <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
    <h1 class="text-2xl font-bold">Sign in</h1>
    <p class="mt-2 text-slate-500">Access your eCommerce account and order history.</p>

    <form class="mt-6 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <label class="mb-1 block text-sm font-medium" for="login-email">Email address</label>
        <input
          id="login-email"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
          type="email"
          formControlName="email"
          autocomplete="email"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <p class="mt-1 text-sm text-red-600">Enter a valid email address.</p>
        }
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium" for="login-password">Password</label>
        <input
          id="login-password"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </div>

      @if (error()) {
        <div class="rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700">
          {{ error() }}
        </div>
      }

      <button
        class="w-full rounded-lg bg-brand-600 px-4 py-2.5 font-semibold text-white hover:bg-brand-700 disabled:bg-slate-300"
        type="submit"
        [disabled]="busy()"
      >
        {{ busy() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      New to eCommerce?
      <a class="font-semibold text-brand-600 hover:text-brand-700" routerLink="/register">
        Create an account
      </a>
    </p>
  </div>
</section>
