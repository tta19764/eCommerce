<div class="flex flex-col gap-3">
  <!-- Root Categories Chips -->
  <div class="flex flex-wrap gap-2 items-center">
    <button
      type="button"
      (click)="selectCategory(null)"
      [class]="!selectedId() ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700/60'"
      class="rounded-xl px-4 py-2 text-xs font-semibold transition-all duration-200 flex items-center gap-1.5"
    >
      <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
      </svg>
      All Categories
    </button>

    @for (cat of rootCategories(); track cat.id) {
      <button
        type="button"
        (click)="selectCategory(cat)"
        [class]="isPathActive(cat.id) ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700 hover:text-white border border-slate-700/60'"
        class="rounded-xl px-4 py-2 text-xs font-semibold transition-all duration-200"
      >
        {{ cat.name }}
      </button>
    }
  </div>

  <!-- Nested Subcategory Levels -->
  @for (level of childLevels(); track $index) {
    <div class="flex flex-wrap gap-2 pl-4 border-l-2 border-indigo-500/30 py-1">
      @for (cat of level; track cat.id) {
        <button
          type="button"
          (click)="selectCategory(cat)"
          [class]="isPathActive(cat.id) ? 'bg-indigo-500 text-white shadow-sm' : 'bg-slate-800/60 text-slate-400 hover:bg-slate-700 hover:text-slate-200 border border-slate-800'"
          class="rounded-lg px-3 py-1.5 text-xs font-medium transition-all duration-200 flex items-center gap-1"
        >
          <span class="text-indigo-400">↳</span>
          {{ cat.name }}
        </button>
      }
    </div>
  }
</div>
