<div class="flex flex-col gap-3">
  <!-- Root Categories Chips -->
  <div class="flex flex-wrap gap-2 items-center">
    <button
      type="button"
      (click)="selectCategory(null)"
      [class]="!selectedId() ? 'bg-indigo-600 text-white shadow-xs font-bold' : 'category-chip-inactive bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-700/60'"
      class="rounded-md px-4 py-2 text-xs font-semibold transition-all duration-200 flex items-center gap-1.5"
    >
      <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
      </svg>
      <span>All Categories</span>
    </button>

    @for (cat of rootCategories(); track cat.id) {
      <button
        type="button"
        (click)="selectCategory(cat)"
        [class]="isPathActive(cat.id) ? 'bg-indigo-600 text-white shadow-xs font-bold' : 'category-chip-inactive bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-700/60'"
        class="rounded-md px-4 py-2 text-xs font-semibold transition-all duration-200"
      >
        {{ cat.name }}
      </button>
    }
  </div>

  <!-- Nested Subcategory Levels -->
  @for (level of childLevels(); track $index) {
    <div class="flex flex-wrap gap-2 pl-4 border-l-2 border-indigo-500/30 py-1">
      @for (cat of level; track cat.id) {
        <button
          type="button"
          (click)="selectCategory(cat)"
          [class]="isPathActive(cat.id) ? 'bg-indigo-600 text-white shadow-xs font-bold' : 'bg-slate-100 dark:bg-slate-800/60 text-slate-700 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 hover:text-slate-900 dark:hover:text-slate-200 border border-slate-300 dark:border-slate-800'"
          class="rounded px-3 py-1.5 text-xs font-medium transition-all duration-200 flex items-center gap-1.5"
        >
          <svg class="h-3 w-3 text-indigo-600 dark:text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
          </svg>
          <span>{{ cat.name }}</span>
        </button>
      }
    </div>
  }
</div>
